# QoS for every topic in the experiment, in one place.
#
# It lives here and not in the source because the two nodes have to offer
# byte-identical profiles: a reliability or a depth that differs between them
# turns a language comparison into a DDS policy comparison, and the difference
# would not show up as an error, only as a different number.
# docker/run_ros_benchmark.sh refuses to start unless this file is identical to
# grasp_node_py/config/qos.yaml.
#
# depth is best-effort with a shallow queue because that is what a real depth
# camera driver offers: a node that cannot keep up drops frames rather than
# building an unbounded backlog, which is the honest failure mode and the one
# the deadline-miss analysis wants to see.
# latency is the opposite: a lost sample there is a hole in the dataset rather
# than a measurement, so it is reliable and deep enough to absorb a burst.
#
# /** applies to both grasp_node and frame_publisher. Each node declares only
# the keys it uses and ignores the rest.
/**:
  ros__parameters:
    qos:
      depth:
        reliability: best_effort
        durability: volatile
        history_depth: 5
      camera_info:
        reliability: best_effort
        durability: volatile
        history_depth: 5
      trajectory:
        reliability: reliable
        durability: volatile
        history_depth: 1
      latency:
        reliability: reliable
        durability: volatile
        history_depth: 256
